<!DOCTYPE html>
<html>
<head>
    <title>Faculty Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .login-box{

            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;

        }

        h2{
            text-align:center;
            color:#007bff;
        }

        input{

            width:100%;
            padding:10px;
            margin:10px 0;

        }

        button{

            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;

        }

        button:hover{

            background:#0056b3;

        }

        .error{

            color:red;
            text-align:center;

        }

    </style>

</head>

<body>

<div class="login-box">

<h2>Faculty Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</body>
</html>
