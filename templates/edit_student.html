<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#007BFF;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#28a745;
            color:#fff;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#218838;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:15px;
        }

        .back{
            text-align:center;
            margin-top:20px;
        }

        .back a{
            text-decoration:none;
            color:#007BFF;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Update Student</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Student ID</label>
        {{ form.student_id }}

        <label>Student Name</label>
        {{ form.name }}

        <label>Email</label>
        {{ form.email }}

        <label>Python Marks</label>
        {{ form.python_marks }}

        <label>Java Marks</label>
        {{ form.java_marks }}

        <label>DBMS Marks</label>
        {{ form.dbms_marks }}

        <button type="submit">
            Update Student
        </button>

    </form>

    <div class="back">
        <a href="{% url 'student_list' %}">← Back to Student List</a>
    </div>

</div>

</body>
</html>
